<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img"><title>Star Catch infrastructure</title><desc>Runtime: GitHub webhooks reach the star-catch intake, which enqueues jobs in Postgres; KEDA starts the star-catch worker, which snapshots the PR, calls the AI services, stores audio in Blob and drafts in the star_catch schema; crux-web reads them; crux-worker takes crux.* jobs and sends emails through Resend. Below: how each repository deploys.</desc><style>text{font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;fill:#1c1917}.mono{font-family:'JetBrains Mono',ui-monospace,monospace}.t{font-size:13px;font-weight:600}.s{font-size:11px;fill:#6b6560}.lbl{font-size:11px;fill:#6b6560}.lane-t{font-size:10px;letter-spacing:.08em;font-weight:600;fill:#6b6560}.sc-t{fill:#1a6585}.cx-t{fill:#8a6d3b}.zone{fill:none;stroke:#ddd8cf;stroke-width:1.5;stroke-dasharray:6 5}.zone-t{font-size:14px;font-weight:600}.lane.sc{fill:#e3eff5}.lane.cx{fill:#f2e8d6}.node{fill:#faf8f4;stroke-width:1.2}.node.sc{stroke:#1a6585}.node.cx{stroke:#8a6d3b}.store{fill:#faf8f4;stroke:#ddd8cf}.ext{fill:#ece6d9;stroke:#ddd8cf}.chip.sc{fill:#e3eff5;stroke:#1a6585}.chip.cx{fill:#f2e8d6;stroke:#8a6d3b}.chip.both{fill:#ece6d9;stroke:#6b6560}.edge{fill:none;stroke:#6b6560;stroke-width:1.5}.mk{fill:#6b6560}.mkh{fill:#0d4f6e}</style><rect width="100%" height="100%" fill="#f2ede4"/><defs><marker id="rah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" class="mk"/></marker><marker id="rahh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" class="mkh"/></marker></defs><rect x="236" y="20" width="718" height="620" rx="10" class="zone"/><text x="252" y="45" class="zone-t" text-anchor="start">Azure · West Europe</text><text x="938" y="45" class="s" text-anchor="end">one copy per environment (dev, prod) · created by crux-infra</text><rect x="256" y="84" width="678" height="146" rx="8" class="lane sc"/><text x="272" y="223" class="lane-t sc-t" text-anchor="start">STAR-CATCH REPO</text><rect x="256" y="478" width="678" height="146" rx="8" class="lane cx"/><text x="272" y="617" class="lane-t cx-t" text-anchor="start">CRUX REPO</text><g class="nd" data-n="intake" data-s="access merge missed pr"><rect x="272" y="118" width="184" height="90" rx="6" class="node sc"/><text x="288" y="144" class="t mono" text-anchor="start">intake</text><text x="288" y="164" class="s" text-anchor="start">Container App</text><text x="288" y="182" class="s" text-anchor="start">scales to zero</text></g><g class="nd" data-n="worker" data-s="merge pr watch"><rect x="484" y="118" width="204" height="90" rx="6" class="node sc"/><text x="500" y="144" class="t mono" text-anchor="start">worker</text><text x="500" y="164" class="s" text-anchor="start">Container Apps Job</text><text x="500" y="182" class="s" text-anchor="start">started by KEDA per job</text></g><g class="nd" data-n="redeliver" data-s="missed"><rect x="716" y="118" width="202" height="90" rx="6" class="node sc"/><text x="732" y="144" class="t mono" text-anchor="start">redeliver</text><text x="732" y="164" class="s" text-anchor="start">Container Apps Job</text><text x="732" y="182" class="s" text-anchor="start">runs every hour</text></g><g class="nd" data-n="web" data-s="access merge pr watch"><rect x="272" y="512" width="184" height="90" rx="6" class="node cx"/><text x="288" y="538" class="t mono" text-anchor="start">crux-web</text><text x="288" y="558" class="s" text-anchor="start">Container App</text><text x="288" y="576" class="s" text-anchor="start">pages, auth, player</text></g><g class="nd" data-n="cworker" data-s="access merge"><rect x="484" y="512" width="204" height="90" rx="6" class="node cx"/><text x="500" y="538" class="t mono" text-anchor="start">crux-worker</text><text x="500" y="558" class="s" text-anchor="start">Container Apps Job</text><text x="500" y="576" class="s" text-anchor="start">courses, access, email</text></g><g class="nd" data-n="pg" data-s="access merge missed pr watch"><rect x="256" y="270" width="440" height="170" rx="6" class="store"/><text x="272" y="294" class="t" text-anchor="start">PostgreSQL</text><text x="680" y="294" class="s" text-anchor="end">one server</text><rect x="272" y="326" width="124" height="102" rx="5" class="chip sc"/><text x="282" y="346" class="t mono" text-anchor="start">star_catch</text><text x="282" y="366" class="s" text-anchor="start">written by star-catch</text><text x="282" y="382" class="s" text-anchor="start">snapshots, drafts</text><text x="282" y="398" class="s" text-anchor="start">labels</text><text x="282" y="414" class="s" text-anchor="start">webhook deliveries</text><rect x="408" y="326" width="124" height="102" rx="5" class="chip both"/><text x="418" y="346" class="t mono" text-anchor="start">pgboss</text><text x="418" y="366" class="s" text-anchor="start">the job queue</text><text x="418" y="382" class="s" text-anchor="start">star-catch.* jobs</text><text x="418" y="398" class="s" text-anchor="start">crux.* jobs</text><text x="418" y="414" class="s" text-anchor="start">both sides use it</text><rect x="544" y="326" width="136" height="102" rx="5" class="chip cx"/><text x="554" y="346" class="t mono" text-anchor="start">public</text><text x="554" y="366" class="s" text-anchor="start">written by Crux</text><text x="554" y="382" class="s" text-anchor="start">users, repos</text><text x="554" y="398" class="s" text-anchor="start">settings</text><text x="554" y="414" class="s" text-anchor="start">emails, XP</text></g><g class="nd" data-n="blob" data-s="pr"><rect x="722" y="270" width="212" height="72" rx="6" class="store"/><text x="738" y="296" class="t" text-anchor="start">Blob storage</text><text x="738" y="316" class="s" text-anchor="start">narration audio</text></g><g class="nd" data-n="kv" data-s=""><rect x="722" y="354" width="100" height="86" rx="6" class="store"/><text x="736" y="380" class="t" text-anchor="start">Key Vault</text><text x="736" y="400" class="s" text-anchor="start">secrets for</text><text x="736" y="416" class="s" text-anchor="start">every app</text></g><g class="nd" data-n="logs" data-s=""><rect x="834" y="354" width="100" height="86" rx="6" class="store"/><text x="848" y="380" class="t" text-anchor="start">Logs</text><text x="848" y="400" class="s" text-anchor="start">Log Analytics</text><text x="848" y="416" class="s" text-anchor="start">30 days</text></g><g class="nd" data-n="github" data-s="access merge missed pr"><rect x="16" y="84" width="190" height="146" rx="6" class="ext"/><text x="32" y="110" class="t" text-anchor="start">GitHub</text><text x="32" y="130" class="s" text-anchor="start">the GitHub App,</text><text x="32" y="146" class="s" text-anchor="start">its API, the repos</text></g><g class="nd" data-n="people" data-s="merge pr watch"><rect x="16" y="478" width="190" height="146" rx="6" class="ext"/><text x="32" y="504" class="t" text-anchor="start">People</text><text x="32" y="524" class="s" text-anchor="start">developers and</text><text x="32" y="540" class="s" text-anchor="start">stakeholders:</text><text x="32" y="556" class="s" text-anchor="start">browser and email</text></g><g class="nd" data-n="ai" data-s="pr"><rect x="984" y="84" width="200" height="146" rx="6" class="ext"/><text x="1000" y="110" class="t" text-anchor="start">AI services</text><text x="1000" y="130" class="s" text-anchor="start">LLM: Claude or</text><text x="1000" y="146" class="s" text-anchor="start">Azure AI Foundry</text><text x="1000" y="170" class="s" text-anchor="start">Azure AI Speech</text><text x="1000" y="186" class="s" text-anchor="start">for narration</text></g><g class="nd" data-n="resend" data-s="merge"><rect x="984" y="512" width="200" height="90" rx="6" class="ext"/><text x="1000" y="538" class="t" text-anchor="start">Resend</text><text x="1000" y="558" class="s" text-anchor="start">sends the emails</text></g><path d="M206,190 L272,190" class="edge" data-s="pr merge access missed" data-both="0" marker-end="url(#rah)"/><text x="239" y="182" class="lbl" data-s="pr merge access missed" text-anchor="middle">webhooks</text><path d="M420,208 L420,270" class="edge" data-s="pr merge access missed" data-both="0" marker-end="url(#rah)"/><text x="428" y="254" class="lbl" data-s="pr merge access missed" text-anchor="start">enqueue</text><path d="M500,208 L500,270" class="edge" data-s="pr merge watch" data-both="1" marker-end="url(#rah)" marker-start="url(#rah)"/><text x="508" y="254" class="lbl" data-s="pr merge watch" text-anchor="start">takes jobs, writes drafts</text><path d="M586,118 L586,72 L178,72 L178,84" class="edge" data-s="pr" data-both="0" marker-end="url(#rah)"/><text x="300" y="100" class="lbl" data-s="pr" text-anchor="start">snapshot, PR comments</text><path d="M686,208 L686,238 L960,238 L960,200 L984,200" class="edge" data-s="pr" data-both="0" marker-end="url(#rah)"/><text x="800" y="232" class="lbl" data-s="pr" text-anchor="middle">scripts, labels, narration</text><path d="M666,208 L666,254 L760,254 L760,270" class="edge" data-s="pr" data-both="0" marker-end="url(#rah)"/><text x="768" y="266" class="lbl" data-s="pr" text-anchor="start">audio</text><path d="M817,118 L817,58 L150,58 L150,84" class="edge" data-s="missed" data-both="1" marker-end="url(#rah)" marker-start="url(#rah)"/><text x="825" y="100" class="lbl" data-s="missed" text-anchor="start">redeliver failed</text><path d="M206,540 L272,540" class="edge" data-s="pr merge watch" data-both="0" marker-end="url(#rah)"/><text x="239" y="532" class="lbl" data-s="pr merge watch" text-anchor="middle">uses Crux</text><path d="M364,512 L364,440" class="edge" data-s="pr merge watch" data-both="1" marker-end="url(#rah)" marker-start="url(#rah)"/><text x="372" y="466" class="lbl" data-s="pr merge watch" text-anchor="start">reads drafts, writes settings</text><path d="M586,512 L586,440" class="edge" data-s="merge access" data-both="1" marker-end="url(#rah)" marker-start="url(#rah)"/><text x="594" y="466" class="lbl" data-s="merge access" text-anchor="start">takes crux.* jobs</text><path d="M290,512 L290,456 L110,456 L110,230" class="edge" data-s="access" data-both="1" marker-end="url(#rah)" marker-start="url(#rah)"/><text x="118" y="330" class="lbl" data-s="access" text-anchor="start">sign-in,</text><text x="118" y="346" class="lbl" data-s="access" text-anchor="start">repo lists</text><path d="M688,557 L984,557" class="edge" data-s="merge" data-both="0" marker-end="url(#rah)"/><text x="836" y="549" class="lbl" data-s="merge" text-anchor="middle">emails with magic links</text><path d="M1084,602 L1084,664 L111,664 L111,624" class="edge" data-s="merge" data-both="0" marker-end="url(#rah)"/><text x="600" y="658" class="lbl" data-s="merge" text-anchor="middle">update emails</text><g transform="translate(0,730)"><text x="16" y="0" class="lane-t" text-anchor="start">HOW EACH REPOSITORY GETS THERE</text><g transform="translate(0,14)"><defs><marker id="dah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" class="mk"/></marker></defs><text x="16" y="22" class="lane-t" text-anchor="start">REPOSITORY</text><text x="296" y="22" class="lane-t" text-anchor="start">GITHUB ACTIONS</text><text x="606" y="22" class="lane-t" text-anchor="start">PRODUCES</text><text x="916" y="22" class="lane-t" text-anchor="start">ENDS UP AS</text><rect x="16" y="40" width="200" height="64" rx="6" class="node cx"/><text x="30" y="66" class="t mono" text-anchor="start">crux</text><text x="30" y="86" class="s" text-anchor="start">Next.js app</text><rect x="296" y="40" width="230" height="64" rx="6" class="store"/><text x="310" y="66" class="t" text-anchor="start">test, build image</text><text x="310" y="86" class="s" text-anchor="start">deploy new revision</text><rect x="606" y="40" width="230" height="64" rx="6" class="store"/><text x="620" y="66" class="t" text-anchor="start">crux image</text><text x="620" y="86" class="s" text-anchor="start">on GHCR</text><rect x="916" y="40" width="268" height="64" rx="6" class="store"/><text x="930" y="66" class="t" text-anchor="start">crux-web, crux-worker</text><text x="930" y="86" class="s" text-anchor="start">migrations Job per deploy</text><path d="M216,72 L296,72" class="edge" marker-end="url(#dah)"/><path d="M526,72 L606,72" class="edge" marker-end="url(#dah)"/><path d="M836,72 L916,72" class="edge" marker-end="url(#dah)"/><rect x="16" y="132" width="200" height="64" rx="6" class="node sc"/><text x="30" y="158" class="t mono" text-anchor="start">star-catch</text><text x="30" y="178" class="s" text-anchor="start">backend + plan + study</text><rect x="296" y="132" width="230" height="64" rx="6" class="store"/><text x="310" y="158" class="t" text-anchor="start">test, build image</text><text x="310" y="178" class="s" text-anchor="start">publish contracts</text><rect x="606" y="132" width="230" height="64" rx="6" class="store"/><text x="620" y="158" class="t" text-anchor="start">star-catch image (GHCR)</text><text x="620" y="178" class="s" text-anchor="start">contracts (GitHub Packages)</text><rect x="916" y="132" width="268" height="64" rx="6" class="store"/><text x="930" y="158" class="t" text-anchor="start">intake, worker, redeliver</text><text x="930" y="178" class="s" text-anchor="start">migrations Job per deploy</text><path d="M216,164 L296,164" class="edge" marker-end="url(#dah)"/><path d="M526,164 L606,164" class="edge" marker-end="url(#dah)"/><path d="M836,164 L916,164" class="edge" marker-end="url(#dah)"/><rect x="16" y="224" width="200" height="64" rx="6" class="ext"/><text x="30" y="250" class="t mono" text-anchor="start">crux-infra</text><text x="30" y="270" class="s" text-anchor="start">Terraform</text><rect x="296" y="224" width="230" height="64" rx="6" class="store"/><text x="310" y="250" class="t" text-anchor="start">plan on PR, apply dev</text><text x="310" y="270" class="s" text-anchor="start">on main, prod by hand</text><rect x="606" y="224" width="230" height="64" rx="6" class="store"/><text x="620" y="250" class="t" text-anchor="start">Terraform state</text><text x="620" y="270" class="s" text-anchor="start">in Azure storage</text><rect x="916" y="224" width="268" height="64" rx="6" class="store"/><text x="930" y="250" class="t" text-anchor="start">environment, Postgres, Blob,</text><text x="930" y="270" class="s" text-anchor="start">Key Vault, identities, budget</text><path d="M216,256 L296,256" class="edge" marker-end="url(#dah)"/><path d="M526,256 L606,256" class="edge" marker-end="url(#dah)"/><path d="M836,256 L916,256" class="edge" marker-end="url(#dah)"/><path d="M150,132 L150,104" class="edge" marker-end="url(#dah)"/><text x="158" y="122" class="lbl" text-anchor="start">crux imports contracts</text></g></g></svg>