<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1320" viewBox="0 0 920 1320" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>PR analysis — from pull request to context</title>
<desc>Two lanes from one pull request snapshot. Code lane: triage files, parse, diff and detect refactorings, build change units, decide whether each is a change, classify each unit, link, group into concerns, rank. Text lane: split into sentences, classify each sentence, keep quoted spans. Both meet in the assembled context.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1c1917" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
  .title { font-size: 18px; font-weight: 600; fill: #1c1917; }
  .th { font-size: 14px; font-weight: 600; fill: #1c1917; }
  .ts { font-size: 12px; fill: #6b6560; }
  .det rect, .det polygon { fill: #e5e9e3; stroke: #1a6585; stroke-width: 0.8; }
  .det .th { fill: #0d4f6e; } .det .ts { fill: #1a6585; }
  .cls rect { fill: #f7e6dc; stroke: #c4572e; stroke-width: 0.8; }
  .cls .th { fill: #8f3a1c; } .cls .ts { fill: #a8472a; }
  .io rect { fill: #ece6d9; stroke: #b9b2a5; stroke-width: 0.8; }
  .out rect { fill: none; stroke: #948d7e; stroke-width: 0.9; stroke-dasharray: 4 3; }
  .out .th { fill: #6b6560; }
  .note rect { fill: #fbf1eb; stroke: #c4572e; stroke-width: 0.9; stroke-dasharray: 4 3; }
  .note .th { fill: #8f3a1c; } .note .ts { fill: #8f3a1c; }
  .arr { stroke: #1c1917; stroke-width: 1.2; fill: none; }
  .lead { stroke: #c4572e; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
</style>
<rect width="920" height="1320" fill="#faf8f4"/>

<text class="title" x="20" y="40">PR analysis — from pull request to context</text>

<g class="io"><rect x="220" y="70" width="680" height="56" rx="6"/><text class="th" x="234" y="92">1 · Collect</text><text class="ts" x="234" y="111">PR metadata, diff, base and head files, commits, description, linked issues, reviews, CI</text></g>
<line class="arr" x1="390" y1="126" x2="390" y2="158" marker-end="url(#a)"/>
<line class="arr" x1="760" y1="126" x2="760" y2="158" marker-end="url(#a)"/>

<!-- code lane -->
<g class="det"><rect x="220" y="160" width="340" height="56" rx="6"/><text class="th" x="234" y="182">2 · Triage files</text><text class="ts" x="234" y="201">rules: paths, .gitattributes, file headers</text></g>
<g class="out"><rect x="16" y="155" width="188" height="66" rx="6"/><text class="th" x="28" y="175">Excluded</text><text class="ts" x="28" y="193">lockfiles, generated,</text><text class="ts" x="28" y="209">vendored, binaries</text></g>
<line class="arr" x1="220" y1="188" x2="207" y2="188" marker-end="url(#a)"/>
<line class="arr" x1="390" y1="216" x2="390" y2="248" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="250" width="340" height="56" rx="6"/><text class="th" x="234" y="272">3 · Parse base and head</text><text class="ts" x="234" y="291">tree-sitter; keys, SQL, document sections</text></g>
<line class="arr" x1="390" y1="306" x2="390" y2="338" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="340" width="340" height="56" rx="6"/><text class="th" x="234" y="362">4 · Pair and detect refactorings</text><text class="ts" x="234" y="381">pair declarations; token hashes, token diff</text></g>
<line class="arr" x1="390" y1="396" x2="390" y2="428" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="430" width="340" height="56" rx="6"/><text class="th" x="234" y="452">5 · Build change units</text><text class="ts" x="234" y="471">edits grouped by their enclosing named thing</text></g>
<line class="arr" x1="390" y1="486" x2="390" y2="518" marker-end="url(#a)"/>

<g class="det"><polygon points="390,520 500,570 390,620 280,570"/><text class="th" x="390" y="575" text-anchor="middle">6 · Is it a change?</text></g>
<g class="out"><rect x="16" y="540" width="188" height="62" rx="6"/><text class="th" x="28" y="560">Not a change</text><text class="ts" x="28" y="578">formatting, comments,</text><text class="ts" x="28" y="594">whitespace only</text></g>
<line class="arr" x1="280" y1="570" x2="207" y2="570" marker-end="url(#a)"/>
<path class="arr" d="M390 620 V634 H312 V650" marker-end="url(#a)"/>
<path class="arr" d="M390 620 V634 H467 V650" marker-end="url(#a)"/>

<g class="det"><rect x="245" y="652" width="135" height="48" rx="6"/><text class="th" x="257" y="671">Structural</text><text class="ts" x="257" y="689">refactoring only</text></g>
<g class="det"><rect x="400" y="652" width="135" height="48" rx="6"/><text class="th" x="412" y="671">Behavioural</text><text class="ts" x="412" y="689">alters what it does</text></g>
<line class="arr" x1="312" y1="700" x2="312" y2="728" marker-end="url(#a)"/>
<line class="arr" x1="467" y1="700" x2="467" y2="728" marker-end="url(#a)"/>

<g class="cls"><rect x="220" y="730" width="340" height="76" rx="6"/><text class="th" x="234" y="752">7 · Classify each unit</text><text class="ts" x="234" y="771">kind · intent · visibility · risk</text><text class="ts" x="234" y="788">closed label sets, one unit at a time</text></g>
<g class="note"><rect x="16" y="713" width="188" height="110" rx="6"/><text class="th" x="28" y="733">Classifier slot</text><text class="ts" x="28" y="752">Now: an LLM choosing</text><text class="ts" x="28" y="767">from fixed labels.</text><text class="ts" x="28" y="785">Later: a small classifier</text><text class="ts" x="28" y="800">(e.g. Jev) trained on</text><text class="ts" x="28" y="815">the stored labels.</text></g>
<line class="lead" x1="204" y1="768" x2="220" y2="768"/>
<line class="arr" x1="390" y1="806" x2="390" y2="838" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="840" width="340" height="56" rx="6"/><text class="th" x="234" y="862">8 · Link units</text><text class="ts" x="234" y="881">calls, shared data, tests, entry points</text></g>
<line class="arr" x1="390" y1="896" x2="390" y2="928" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="930" width="340" height="56" rx="6"/><text class="th" x="234" y="952">9 · Group into concerns</text><text class="ts" x="234" y="971">connected units, one story each</text></g>
<line class="arr" x1="390" y1="986" x2="390" y2="1018" marker-end="url(#a)"/>

<g class="det"><rect x="220" y="1020" width="340" height="56" rx="6"/><text class="th" x="234" y="1042">10 · Rank concerns</text><text class="ts" x="234" y="1061">visibility × reach — later the graph ranking</text></g>
<line class="arr" x1="390" y1="1076" x2="390" y2="1108" marker-end="url(#a)"/>

<!-- text lane -->
<g class="det"><rect x="620" y="160" width="280" height="56" rx="6"/><text class="th" x="634" y="182">A · Split into sentences</text><text class="ts" x="634" y="201">description, issues, commits, reviews</text></g>
<line class="arr" x1="760" y1="216" x2="760" y2="248" marker-end="url(#a)"/>

<g class="cls"><rect x="620" y="250" width="280" height="76" rx="6"/><text class="th" x="634" y="272">B · Classify each sentence</text><text class="ts" x="634" y="291">problem · rationale · behaviour</text><text class="ts" x="634" y="308">instruction · noise</text></g>
<line class="arr" x1="760" y1="326" x2="760" y2="358" marker-end="url(#a)"/>

<g class="det"><rect x="620" y="360" width="280" height="56" rx="6"/><text class="th" x="634" y="382">C · Keep quoted spans</text><text class="ts" x="634" y="401">extractive — no generated text</text></g>
<line class="arr" x1="760" y1="416" x2="760" y2="1108" marker-end="url(#a)"/>

<!-- merge -->
<g class="det"><rect x="220" y="1110" width="680" height="60" rx="6"/><text class="th" x="234" y="1133">11 · Assemble the context</text><text class="ts" x="234" y="1153">facts from labels, counts, links and quoted text — every fact with its source</text></g>
<line class="arr" x1="560" y1="1170" x2="560" y2="1202" marker-end="url(#a)"/>

<g class="io"><rect x="390" y="1204" width="340" height="52" rx="6"/><text class="th" x="404" y="1225">PR context</text><text class="ts" x="404" y="1243">→ section selection in the update spec</text></g>

<!-- legend -->
<g class="det"><rect x="20" y="1282" width="16" height="12" rx="2"/></g><text class="ts" x="42" y="1292">Rules and parsing</text>
<g class="cls"><rect x="190" y="1282" width="16" height="12" rx="2"/></g><text class="ts" x="212" y="1292">Classification — LLM now, e.g. Jev later</text>
<g class="out"><rect x="500" y="1282" width="16" height="12" rx="2"/></g><text class="ts" x="522" y="1292">Not part of the context</text>
<g class="io"><rect x="700" y="1282" width="16" height="12" rx="2"/></g><text class="ts" x="722" y="1292">Input and output</text>
</svg>
