# Local services. Tests start their own Postgres (testcontainers) and don't need this.
# `docker compose up -d` starts Postgres; `--profile app` adds the backend built from this repo.
x-backend: &backend
  image: star-catch:local
  build: .
  profiles: [app]
  environment: &env
    DATABASE_URL: postgres://star_catch:star_catch@postgres:5432/star_catch

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: star_catch
      POSTGRES_PASSWORD: star_catch
      POSTGRES_DB: star_catch
    ports:
      - "${STAR_CATCH_PG_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "star_catch"]
      interval: 2s
      timeout: 2s
      retries: 15

  migrate:
    <<: *backend
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy

  intake:
    <<: *backend
    command: intake
    environment:
      <<: *env
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-dev}
    ports:
      - "${STAR_CATCH_INTAKE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Recorded snapshots instead of GitHub: replay fixtures/webhooks/* to drive it.
  worker:
    <<: *backend
    command: [worker, --watch]
    environment:
      <<: *env
      STAR_CATCH_MOCK_GITHUB: "true"
      STAR_CATCH_REPOS: pmndrs/zustand
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres:
