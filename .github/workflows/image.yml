name: image

# Builds the backend image on pull requests; from main, pushes ghcr.io/kiasm-tech/star-catch:<sha> and :main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/kiasm-tech/star-catch:${{ github.sha }}
            ghcr.io/kiasm-tech/star-catch:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
