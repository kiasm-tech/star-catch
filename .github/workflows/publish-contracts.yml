name: publish-contracts

# Tag contracts-v<version> (matching packages/contracts/package.json) to publish to GitHub Packages.
on:
  push:
    tags: ["contracts-v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@kiasm-tech"
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: test "contracts-v$(node -p "require('./packages/contracts/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter @kiasm-tech/star-catch-contracts build
      - run: pnpm --filter @kiasm-tech/star-catch-contracts publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
